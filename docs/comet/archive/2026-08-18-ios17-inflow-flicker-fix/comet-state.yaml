acceptance:
  - id: A1
    source: brief.md
    text: 息屏充电 → 热控触发 `setInflowStatus(NO)`（temp_paused）进入禁流稳态 → 亮屏 → **不**收到
      `noti_start_charge` 通知（充电线全程未动）。
    result: passed
    reason:
      text: 源码逻辑 passed：热控触发 setInflowStatus(NO) 进入 temp_paused
        后，isInflowGuardActive(NO, g_policyState) 命中（daemon.mm
        L171），isAdaptorConnect 走 AdapterDetails 分支不读
        ExternalChargeCapable（L1254-1263），isAdaptorNewConnect 直接 return
        NO（L1274-1276），freshPlug 门禁在 currentState/previousState 为 temp_paused
        时返回 nil（L2149-2151），不会误发
        noti_start_charge。test_inflow_guard_helper_exists_and_uses_semantic_state
        / test_freshPlug_gate_suppressed_in_inflow_state
        已通过。真机验收作为发布后回归项（用户已确认接受 blocked→pass 归档），不阻塞。
      truncated: false
  - id: A2
    source: brief.md
    text: 息屏充电 → 容量到上限触发停充（adv_disable_inflow=YES 路径）进入禁流稳态 → 亮屏 → **不**收到
      `noti_start_charge`。
    result: passed
    reason:
      text: 源码逻辑 passed：adv_disable_inflow=YES 路径下
        isInflowGuardActive(advDisableInflow=YES,...) 第一分支即返回 YES（L167-169），与原
        disableInflow.boolValue 分支叠加覆盖停充稳态；isAdaptorNewConnect L1274 条件命中 return
        NO，freshPlug 门禁 L2149 命中 return
        nil。test_isAdaptorNewConnect_suppresses_edge_in_inflow_state /
        test_freshPlug_gate_suppressed_in_inflow_state 已通过。真机验收作为发布后回归项，不阻塞。
      truncated: false
  - id: A3
    source: brief.md
    text: 禁流稳态下系统周期性刷新 IOKit 属性导致 `ExternalChargeCapable` 短暂 false→true 抖动 →
      `isAdaptorNewConnect` 不产生边沿 → 不误发通知。
    result: passed
    reason:
      text: 源码逻辑 passed：禁流稳态下 ExternalChargeCapable 短暂 false→true
        抖动时，isAdaptorNewConnect 因 isInflowGuardActive 命中直接 return NO
        不产生边沿（L1274-1276），isAdaptorConnect 也不读
        ExternalChargeCapable（L1254-1263），freshPlug
        门禁双轮守卫再兜底（L2149）。test_isAdaptorConnect_uses_inflow_guard_when_not_user_disabled
        / test_isAdaptorNewConnect_suppresses_edge_in_inflow_state
        已通过。真机验收作为发布后回归项，不阻塞。
      truncated: false
  - id: A4
    source: brief.md
    text: 禁流稳态下真正拔线 → `AdapterDetails` 消失 → `isAdaptorConnect` 正确返回 NO → 后续重新插电时
      `isAdaptorNewConnect` 正常产生边沿 → 正常发 `noti_start_charge`（真插电仍要通知）。
    result: passed
    reason:
      text: 源码与静态测试可判定。禁流态下真拔线时 AdapterDetails 消失 → isAdaptorConnect 走 L1256-1258 返回
        NO；policy 转出禁流态（no_inflow/temp_paused）后 isInflowGuardActive 返回
        NO，守卫解除，isAdaptorNewConnect 恢复 !isAdaptorConnect(oldInfo) &&
        isAdaptorConnect(info) 边沿判定（L1277），freshPlug 门禁 L2149 不再命中，可正常发
        noti_start_charge（L2152-2154）。brief Constraints
        守卫有界性满足。test_isAdaptorConnect_uses_inflow_guard_when_not_user_disabled
        验证 AdapterDetails 分支语义。
      truncated: false
  - id: A5
    source: brief.md
    text: 非禁流态（正常充电中、未触发任何禁流）→ `isAdaptorConnect` 走原 `ExternalChargeCapable`
      路径，行为与原版一致，不回归。
    result: passed
    reason:
      text: 源码与静态测试可判定。非禁流态（adv_disable_inflow=NO 且 g_policyState 非
        no_inflow/temp_paused）下 isInflowGuardActive 返回 NO，isAdaptorConnect 走
        else 分支读
        ExternalChargeCapable.boolValue（L1264-1267），与原版一致；isAdaptorNewConnect
        走原边沿判定（L1277）；freshPlug 门禁 L2149 不命中，按原逻辑 L2152-2154 发
        noti_start_charge。全量 unittest discover 138 项通过，无回归。
      truncated: false
  - id: A6
    source: brief.md
    text: 热控恢复（temperature_recovered）从 temp_paused 恢复充电 → 仍按原逻辑发
      `noti_resume_charge_temperature`，不被禁流态守卫误抑制。
    result: passed
    reason:
      text: 源码逻辑 passed：热控恢复 temperature_recovered 从 temp_paused 转出时走 stillPlugged
        分支（previousExternalConnected &&
        currentExternalConnected，L2142、L2158-2160），不进 freshPlug
        守卫；resumedFromTempPause 判定 L2176-2177 命中，L2178-2180 正常返回
        noti_resume_charge_temperature，不被禁流态守卫误抑制。test_inflow_guard_does_not_block_temperature_resume
        验证 temperature_recovered 与 noti_resume_charge_temperature
        路径存在。真机验收作为发布后回归项，不阻塞。
      truncated: false
