    text: A2：thermal 模式写入唯一入口为 `setThermalSimulationMode`（NSUserDefaults
      suite=com.apple.cltm），仅由充电命令边沿（setBatteryStatus
      停充→默认档/开充→限流档）与配置变更边沿（set_conf /
      set_limit_inflow）触发；电池事件流不参与（onBatteryEventEnd 为空），无任何定时器可达 thermal 写入。
    result: passed
    reason:
      text: thermal 写入唯一入口 setThermalSimulationMode（utils.mm:3539-3545，NSUserDefaults
        suiteName=com.apple.cltm 写
        thermalSimulationMode），全仓仅两个调用点：daemon.mm:1835（applyThermalModeForCurrentState）与
        daemon.mm:1878（restoreThermalSimulationForReset 写
        off，仅限卸载/退出复位链，非限流控制）。applyThermalModeForCurrentState
        触发点全部为边沿：setBatteryStatus（daemon.mm:1843，停充→g_chargeCommandEnabled=NO→默认档/开充→YES→限流档，见决策函数
        1821-1832）、set_conf（daemon.mm:3578-3586，键
        adv_def_thermal_mode/adv_limit_inflow/adv_limit_inflow_mode/adv_thermal_mode_lock）、set_limit_inflow_config（daemon.mm:3617）。onBatteryEventEnd
        为空（daemon.mm:2607-2610，仅注释，调用点 3284/3313）。决策函数只读 4
        个配置键+g_chargeCommandEnabled，不读系统实时信号。全 daemon 仅 3 个 NSTimer（752
        holdMonitor、774 disableInflowRetry、862 trollStoreBundleCheck）：前两者只能经
        refreshBatteryStateAndApplyPolicy→applyChargePolicy 的充电命令边沿间接连带 thermal
        写入，无定时器直接发起 thermal 写；无 60s 自愈定时器残留。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：关闭限流（`adv_limit_inflow` off 且无 `adv_thermal_mode_lock`）后，集中决策函数返回默认
      thermal 档（`adv_def_thermal_mode`，默认关闭）。
    result: passed
    reason:
      text: 'targetThermalModeForCurrentState（daemon.mm:1821-1832）：lock=NO
        跳过锁定分支；limitInflow=NO 跳过限流分支，返回
        defaultMode=getLocalString(@"adv_def_thermal_mode", @"off")；initConf 默认值
        adv_def_thermal_mode: off（daemon.mm:3348）。即 adv_limit_inflow off 且无
        adv_thermal_mode_lock 时集中决策函数返回默认档（默认关闭），不依赖任何电池读数。'
