    - id: readme-links
      name:
        text: README 本地链接与图片路径存在性
        truncated: false
      argv_display:
        - text: -c
          truncated: false
        - text: >-
            import re,os,sys

            md=open('README.md',encoding='utf-8').read()

            miss=[t for t in re.findall(r'\[[^\]]*\]\(([^)#\s]+)[^)]*\)',md) if
            not t.startswith(('http','mailto:')) and not os.path.exists(t)]

            miss+=[s for s in re.findall(r'<img src="([^"]+)"',md) if not
            os.path.exists(s)]

            if miss:
                print('MISSING',miss); sys.exit(1)
            print('ALL_LINK_TARGETS_EXIST')
          truncated: false
      argv_truncated: false
      cwd_ref: .
      status: passed
      exit_code: 0
      duration_ms: 23
    - id: readme-anchors
      name:
        text: README 内部锚点全部可解析
        truncated: false
      argv_display:
        - text: -c
          truncated: false
        - text: >-
            import re,sys

            md=open('README.md',encoding='utf-8').read()

            heads=[]

            for line in md.splitlines():
                m=re.match(r'^(#{1,6})\s+(.*)',line)
                if m: heads.append(m.group(2).strip())
            def gh_anchor(t):
                t=t.strip().lower(); t=re.sub(r'[^\w\u4e00-\u9fff\- ]','',t); return t.replace(' ','-')
            anchors={}

            for h in heads:
                a=gh_anchor(h); anchors[a]=anchors.get(a,0)+1
            bad=[t for t in re.findall(r'\[[^\]]*\]\(#([^)]+)\)',md) if t not in
            anchors]

            if bad:
                print('BAD_ANCHORS',bad); sys.exit(1)
            print('ALL_ANCHORS_RESOLVE')
          truncated: false
      argv_truncated: false
      cwd_ref: .
      status: passed
      exit_code: 0
      duration_ms: 24
    - id: stale-description-grep
      name:
        text: 旧描述残留检查（刷新档位/开始充电可见性）
        truncated: false
      argv_display:
