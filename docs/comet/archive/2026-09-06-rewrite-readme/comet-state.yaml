            md=open('README.md',encoding='utf-8').read()

            bad=[]

            if '3 分钟 / 5 分钟' in md or '3 min / 5 min' in md: bad.append('stale
            refresh tiers')

            if '滑块（10–95）' in md or 'slider (10–95)' in md: bad.append('stale
            charge-below slider as visible control')

            if '4 档' not in md and '1 秒 / 20 秒 / 1 分钟 / 10 分钟' not in md:
            bad.append('missing corrected tiers zh')

            if '1 s / 20 s / 1 min / 10 min' not in md: bad.append('missing
            corrected tiers en')

            if bad:
                print('STALE',bad); sys.exit(1)
            print('NO_STALE_DESCRIPTION')
          truncated: false
      argv_truncated: false
      cwd_ref: .
      status: passed
      exit_code: 0
      duration_ms: 22
