name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag，例如 v1.12.5"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      RELEASE_REPO: ${{ github.repository }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install packaging tools
        run: brew install dpkg ldid ripgrep

      - name: Prepare Theos headers
        run: |
          set -euo pipefail
          sudo mkdir -p /opt
          if [ ! -d /opt/theos ]; then
            sudo git clone --depth 1 --recursive https://github.com/theos/theos.git /opt/theos
          else
            cd /opt/theos
            sudo git submodule update --init --recursive
          fi
          if [ ! -d /opt/theos/vendor/include ]; then
            echo "Missing /opt/theos/vendor/include after clone" >&2
            exit 1
          fi
          sudo ln -sfn /opt/theos/vendor/include /opt/include
          sudo mkdir -p /opt/framework /opt/lib
          test -f /opt/theos/vendor/include/IOKit/hid/IOHIDService.h
          test -f /opt/theos/vendor/include/MobileCoreServices/LSApplicationProxy.h

      # Native roothide path (same as local default ./scripts/build_packages.sh):
      #   HEADER: /opt/theos/vendor/include + /opt/theos/vendor/include/roothide
      #   LIBRARY: /opt/theos/vendor/lib/iphone/roothide (+ ChargeLimiter/libroot.a stub via build script)
      #   MonkeyDevTheosPath: /opt/theos
      #   Link: -lroot  → needs libroot.a (NOT only libroothide.tbd from Xcode devkit)
      # Official refs: https://github.com/roothide/Developer  https://github.com/roothide/theos
      - name: Prepare roothide toolchain
        run: |
          set -euo pipefail

          ROOTHIDE_INC="/opt/theos/vendor/include/roothide"
          ROOTHIDE_LIB="/opt/theos/vendor/lib/iphone/roothide"
          ROOTLESS_LIB="/opt/theos/vendor/lib/iphone/rootless"
          VENDOR_LIB="/opt/theos/vendor/lib"
          VENDOR_INC="/opt/theos/vendor/include"
          sudo mkdir -p "$ROOTHIDE_INC" "$ROOTHIDE_LIB" "$ROOTLESS_LIB" "$VENDOR_LIB" /opt

          # Prefer a full roothide/theos tree. If vendor is empty after plain theos clone,
          # overlay vendor from roothide/theos (same layout local machines use).
          install_from_roothide_theos() {
            if [ ! -d /opt/theos_roothide/.git ]; then
              echo "[INFO] Cloning roothide/theos into /opt/theos_roothide..."
              if ! sudo git clone --depth 1 --recursive https://github.com/roothide/theos.git /opt/theos_roothide; then
                echo "[WARN] Failed to clone https://github.com/roothide/theos.git" >&2
                return 1
              fi
            else
              echo "[INFO] Using existing /opt/theos_roothide"
              sudo git -C /opt/theos_roothide submodule update --init --recursive || true
            fi

            # Ensure submodules that carry headers/libs are present.
            if [ -x /opt/theos_roothide/bin/update-theos ]; then
              sudo /opt/theos_roothide/bin/update-theos || true
            fi
            sudo git -C /opt/theos_roothide submodule update --init --recursive || true

            # Headers
            if [ -d /opt/theos_roothide/vendor/include ] && [ "$(ls -A /opt/theos_roothide/vendor/include 2>/dev/null || true)" ]; then
              # Merge, do not wipe host theos vendor entirely if already populated.
              sudo rsync -a /opt/theos_roothide/vendor/include/ "$VENDOR_INC/"
            fi
            if [ -d /opt/theos_roothide/vendor/include/roothide ]; then
              sudo mkdir -p "$ROOTHIDE_INC"
              sudo cp -a /opt/theos_roothide/vendor/include/roothide/. "$ROOTHIDE_INC/"
            fi
            if [ -f /opt/theos_roothide/vendor/include/roothide.h ]; then
              sudo cp -a /opt/theos_roothide/vendor/include/roothide.h "$VENDOR_INC/roothide.h"
            fi
            if [ -d /opt/theos_roothide/vendor/include/libroot ]; then
              sudo mkdir -p "$VENDOR_INC/libroot"
              sudo cp -a /opt/theos_roothide/vendor/include/libroot/. "$VENDOR_INC/libroot/"
            fi
            if [ -f /opt/theos_roothide/vendor/include/libroot.h ]; then
              sudo cp -a /opt/theos_roothide/vendor/include/libroot.h "$VENDOR_INC/libroot.h"
            fi

            # Libs (roothide + rootless + top-level vendor/lib)
            if [ -d /opt/theos_roothide/vendor/lib ]; then
              sudo rsync -a /opt/theos_roothide/vendor/lib/ "$VENDOR_LIB/"
            fi
            if [ -d /opt/theos_roothide/vendor/lib/iphone/roothide ]; then
              sudo mkdir -p "$ROOTHIDE_LIB"
              sudo cp -a /opt/theos_roothide/vendor/lib/iphone/roothide/. "$ROOTHIDE_LIB/"
            fi
            if [ -d /opt/theos_roothide/vendor/lib/iphone/rootless ]; then
              sudo mkdir -p "$ROOTLESS_LIB"
              sudo cp -a /opt/theos_roothide/vendor/lib/iphone/rootless/. "$ROOTLESS_LIB/"
            fi

            # Surface libroot.a into every path Xcode/build_packages may search.
            for candidate in \
              "$ROOTHIDE_LIB/libroot.a" \
              "$VENDOR_LIB/libroot.a" \
              "$ROOTLESS_LIB/libroot.a" \
              /opt/theos_roothide/vendor/lib/iphone/roothide/libroot.a \
              /opt/theos_roothide/vendor/lib/libroot.a \
              /opt/theos_roothide/vendor/lib/iphone/rootless/libroot.a
            do
              if [ -f "$candidate" ]; then
                sudo mkdir -p "$ROOTHIDE_LIB" "$ROOTLESS_LIB" "$VENDOR_LIB"
                sudo cp -a "$candidate" "$ROOTHIDE_LIB/libroot.a"
                sudo cp -a "$candidate" "$VENDOR_LIB/libroot.a"
                sudo cp -a "$candidate" "$ROOTLESS_LIB/libroot.a"
                echo "[INFO] libroot.a sourced from $candidate"
                break
              fi
            done

            # libroothide.tbd is optional (runtime dylib on device); keep if present.
            for candidate in \
              "$ROOTHIDE_LIB/libroothide.tbd" \
              "$VENDOR_LIB/libroothide.tbd" \
              /opt/theos_roothide/vendor/lib/iphone/roothide/libroothide.tbd \
              /opt/theos_roothide/vendor/lib/libroothide.tbd
            do
              if [ -f "$candidate" ]; then
                sudo cp -a "$candidate" "$ROOTHIDE_LIB/libroothide.tbd"
                break
              fi
            done

            return 0
          }

          # Last resort only: Xcode devkit zip is headers + tbd stub, usually NO libroot.a.
          # Keep for headers; never treat tbd alone as enough for -lroot.
          install_headers_from_libroothide_devkit() {
            echo "[INFO] Trying libroothide Xcode devkit for headers only (best-effort)..."
            TMP="$(mktemp -d)"
            if ! curl -fsSL -o "$TMP/devkit.zip" \
              "https://github.com/RootHide/libroothide/files/12643716/devkit.zip"
            then
              echo "[WARN] devkit.zip download failed" >&2
              rm -rf "$TMP"
              return 1
            fi
            unzip -q "$TMP/devkit.zip" -d "$TMP/devkit"
            while IFS= read -r hdr; do
              sudo mkdir -p "$ROOTHIDE_INC"
              sudo cp -a "$hdr" "$ROOTHIDE_INC/" || true
              case "$(basename "$hdr")" in
                roothide.h) sudo cp -a "$hdr" "$VENDOR_INC/roothide.h" || true ;;
              esac
            done < <(find "$TMP/devkit" -type f \( -name 'roothide.h' -o -name 'stub.h' -o -name 'module.modulemap' \) 2>/dev/null || true)
            while IFS= read -r tbd; do
              sudo mkdir -p "$ROOTHIDE_LIB"
              sudo cp -a "$tbd" "$ROOTHIDE_LIB/" || true
            done < <(find "$TMP/devkit" -type f -name 'libroothide.tbd' 2>/dev/null || true)
            rm -rf "$TMP"
            return 0
          }

          install_from_roothide_theos || true

          # If plain theos vendor already has libroot (e.g. from a full local-style tree), use it.
          if ! ls "$ROOTHIDE_LIB"/libroot* >/dev/null 2>&1; then
            for candidate in \
              "$VENDOR_LIB/libroot.a" \
              "$ROOTLESS_LIB/libroot.a"
            do
              if [ -f "$candidate" ]; then
                sudo cp -a "$candidate" "$ROOTHIDE_LIB/libroot.a"
                echo "[INFO] Promoted existing $candidate into roothide lib dir"
                break
              fi
            done
          fi

          if [ ! -f "$VENDOR_INC/roothide.h" ] && [ ! -f "$ROOTHIDE_INC/roothide.h" ]; then
            install_headers_from_libroothide_devkit || true
          fi

          # Match local build_packages ensure_local_libroot_stubs: project-dir fallback.
          if [ -f "$ROOTHIDE_LIB/libroot.a" ] || [ -f "$VENDOR_LIB/libroot.a" ] || [ -f "$ROOTLESS_LIB/libroot.a" ]; then
            mkdir -p ChargeLimiter
            for candidate in "$ROOTHIDE_LIB/libroot.a" "$VENDOR_LIB/libroot.a" "$ROOTLESS_LIB/libroot.a"; do
              if [ -f "$candidate" ]; then
                cp -a "$candidate" ChargeLimiter/libroot.a
                echo "[INFO] CI local stub ChargeLimiter/libroot.a from $candidate"
                break
              fi
            done
            if [ -f "$ROOTHIDE_LIB/libroothide.tbd" ]; then
              cp -a "$ROOTHIDE_LIB/libroothide.tbd" ChargeLimiter/libroothide.tbd || true
            fi
          fi

          echo "[INFO] roothide include dir:"
          ls -la "$ROOTHIDE_INC" || true
          echo "[INFO] roothide lib dir:"
          ls -la "$ROOTHIDE_LIB" || true
          echo "[INFO] vendor libroot candidates:"
          ls -la "$VENDOR_LIB"/libroot* "$ROOTLESS_LIB"/libroot* "$ROOTHIDE_LIB"/libroot* 2>/dev/null || true
          ls -la ChargeLimiter/libroot.a 2>/dev/null || true

          if [ ! -f "$ROOTHIDE_LIB/libroot.a" ] \
            && [ ! -f "$VENDOR_LIB/libroot.a" ] \
            && [ ! -f "$ROOTLESS_LIB/libroot.a" ] \
            && [ ! -f ChargeLimiter/libroot.a ]
          then
            cat >&2 <<'EOF'
[ERR] Native roothide/rootless link dependency libroot.a is missing.

ChargeLimiter links with -lroot. Required (any one, preferably all mirrored):
  /opt/theos/vendor/lib/iphone/roothide/libroot.a
  /opt/theos/vendor/lib/libroot.a
  /opt/theos/vendor/lib/iphone/rootless/libroot.a
  ChargeLimiter/libroot.a   (local stub; gitignored; filled by build_packages.sh)

CI tried:
  1) clone https://github.com/roothide/theos.git → /opt/theos_roothide and rsync vendor
  2) promote any existing vendor/rootless libroot into roothide path
  3) optional header-only devkit (does NOT provide libroot.a)

libroothide.tbd alone is NOT enough for -lroot.

Fix on the runner image or in this workflow: install a full Theos vendor that
contains libroot.a (same as a working local /opt/theos or Develop/theos-roothide).
EOF
            exit 1
          fi

          if [ ! -f "$VENDOR_INC/roothide.h" ] \
            && [ ! -f "$ROOTHIDE_INC/roothide.h" ]
          then
            echo "[WARN] roothide.h not found; native compile may still succeed if only libroot is required." >&2
          fi

      - name: Verify release tag matches project version
        run: |
          PROJECT_VERSION="$(awk -F' = ' '/MARKETING_VERSION =/{gsub(/;/, "", $2); print $2; exit}' ChargeLimiter.xcodeproj/project.pbxproj)"
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$PROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match MARKETING_VERSION ($PROJECT_VERSION)." >&2
            exit 1
          fi

      - name: Probe build environment
        run: |
          command -v xcodebuild
          command -v dpkg-deb
          command -v ldid
          command -v rg
          test -f /opt/theos/vendor/include/IOKit/hid/IOHIDService.h
          test -f /opt/theos/vendor/include/MobileCoreServices/LSApplicationProxy.h
          test -e /opt/include
          ls -ld /opt/include /opt/theos /opt/theos/vendor/include
          test "$(readlink /opt/include)" = "/opt/theos/vendor/include"
          ls -la /opt/theos/vendor/lib/iphone/roothide
          ls /opt/theos/vendor/lib/iphone/roothide/libroot* >/dev/null
          xcodebuild -version

      - name: Build packages
        run: ./scripts/build_packages.sh

      - name: Verify expected release assets
        run: |
          set -euo pipefail
          TAG_VERSION="${RELEASE_TAG#v}"
          test -f "out/ChargeLimiter_${TAG_VERSION}_TrollStore.tipa"
          test -f "out/ChargeLimiter_${TAG_VERSION}_rootful_arm.deb"
          test -f "out/ChargeLimiter_${TAG_VERSION}_rootless_arm64.deb"
          test -f "out/ChargeLimiter_${TAG_VERSION}_roothide_arm64e.deb"
          ls -l out/ChargeLimiter_*

          # Unpack native roothide deb and assert layout / arch / version.
          TMP="$(mktemp -d)"
          cleanup() { rm -rf "$TMP"; }
          trap cleanup EXIT

          dpkg-deb -R "out/ChargeLimiter_${TAG_VERSION}_roothide_arm64e.deb" "$TMP"

          grep -q "Architecture: iphoneos-arm64e" "$TMP/DEBIAN/control"
          grep -E -q "^Version: ${TAG_VERSION}$" "$TMP/DEBIAN/control"

          test -d "$TMP/Applications/ChargeLimiter.app"
          test -f "$TMP/Applications/ChargeLimiter.app/Info.plist"
          test ! -d "$TMP/var/jb"
          test ! -e "$TMP/var/jb/Applications/ChargeLimiter.app"

          # macOS runner ships PlistBuddy here:
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$TMP/Applications/ChargeLimiter.app/Info.plist" | grep -qx "$TAG_VERSION"

          echo "[OK] roothide deb content checks passed for ${TAG_VERSION}"

      - name: Generate release notes
        run: |
          mkdir -p out
          ./scripts/generate_release_notes.py \
            --current-tag "$RELEASE_TAG" \
            --repo "$RELEASE_REPO" \
            --output out/release-notes.md

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file out/release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file out/release-notes.md
          fi

          gh release upload "$RELEASE_TAG" \
            out/ChargeLimiter_* \
            --clobber
